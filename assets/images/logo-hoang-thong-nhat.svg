<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 70" width="520" height="70">
  <defs>
    <style>
      .logo-title {
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 27px;
        letter-spacing: -0.02em;
      }
      .logo-title-red {
        fill: #EE0033;
      }
      .logo-title-dark {
        fill: #111827;
      }
      .logo-subtitle {
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #4B5563;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Left Icon: Modern Viettel Red Emblem with HTN -->
  <g transform="translate(4, 5)">
    <rect width="60" height="60" rx="16" fill="#EE0033"/>
    <text x="30" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">HTN</text>
  </g>

  <!-- Typography Right -->
  <g transform="translate(76, 0)">
    <text x="0" y="36" class="logo-title">
      <tspan class="logo-title-red">HOÀNG</tspan> <tspan class="logo-title-dark">THỐNG NHẤT</tspan>
    </text>
    <text x="0" y="58" class="logo-subtitle">
      HỆ SINH THÁI GIẢI PHÁP DOANH NGHIỆP &amp; HỘ KINH DOANH
    </text>
  </g>
</svg>
