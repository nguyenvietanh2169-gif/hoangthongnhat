<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0033"/>
      <stop offset="100%" stop-color="#B30026"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="#FAFAFA" rx="16"/>
  <!-- Invoice Paper -->
  <rect x="80" y="30" width="240" height="180" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow2)"/>
  <!-- Header Bar -->
  <rect x="105" y="50" width="70" height="12" rx="4" fill="url(#gradRed2)"/>
  <rect x="235" y="50" width="60" height="10" rx="3" fill="#E5E7EB"/>
  <!-- Horizontal divider -->
  <line x1="105" y1="75" x2="295" y2="75" stroke="#F3F4F6" stroke-width="2"/>
  <!-- Invoice Table Rows -->
  <rect x="105" y="92" width="190" height="12" rx="4" fill="#FFF0F2"/>
  <rect x="115" y="95" width="80" height="6" rx="3" fill="#EE0033"/>
  <rect x="250" y="95" width="35" height="6" rx="3" fill="#EE0033"/>
  <rect x="105" y="115" width="190" height="12" rx="4" fill="#FAFAFA"/>
  <rect x="115" y="118" width="65" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="250" y="118" width="35" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="105" y="136" width="190" height="12" rx="4" fill="#FAFAFA"/>
  <rect x="115" y="139" width="90" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="250" y="139" width="35" height="6" rx="3" fill="#9CA3AF"/>
  <!-- Total stamp / Tax Seal -->
  <circle cx="260" cy="178" r="20" fill="none" stroke="#EE0033" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="260" cy="178" r="16" fill="#FFF0F2"/>
  <text x="260" y="182" font-family="sans-serif" font-size="8" font-weight="bold" fill="#EE0033" text-anchor="middle">TT78</text>
  <rect x="105" y="172" width="100" height="12" rx="4" fill="url(#gradRed2)"/>
</svg>