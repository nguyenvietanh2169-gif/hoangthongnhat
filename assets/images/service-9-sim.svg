<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0033"/>
      <stop offset="100%" stop-color="#B30026"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="#FAFAFA" rx="16"/>
  <!-- VIP SIM Card -->
  <rect x="85" y="45" width="230" height="150" rx="16" fill="url(#gradRed9)"/>
  <!-- Gold Chip on SIM -->
  <rect x="115" y="75" width="55" height="45" rx="8" fill="#FCD34D" stroke="#F59E0B" stroke-width="2"/>
  <line x1="115" y1="98" x2="170" y2="98" stroke="#D97706" stroke-width="1.5"/>
  <line x1="142" y1="75" x2="142" y2="120" stroke="#D97706" stroke-width="1.5"/>
  <rect x="130" y="88" width="25" height="20" rx="4" fill="#FDE68A"/>
  <!-- Viettel Logo text on SIM -->
  <text x="290" y="82" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="end">viettel</text>
  <text x="290" y="98" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" opacity="0.9" text-anchor="end">HOTLINE VIP</text>
  <!-- Beautiful Phone Number Display -->
  <rect x="115" y="145" width="170" height="32" rx="8" fill="#FFFFFF"/>
  <text x="200" y="167" font-family="sans-serif" font-size="14" font-weight="900" fill="#EE0033" text-anchor="middle" letter-spacing="1">08 1789 1789</text>
</svg>