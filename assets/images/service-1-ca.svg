<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0033"/>
      <stop offset="100%" stop-color="#B30026"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EE0033" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="#FAFAFA" rx="16"/>
  <!-- Main Certificate Card -->
  <rect x="50" y="35" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="2" filter="url(#shadow)"/>
  <!-- Top bar of card -->
  <path d="M50 49 C50 41 56 35 64 35 L336 35 C344 35 350 41 350 49 L350 65 L50 65 Z" fill="url(#gradRed)"/>
  <circle cx="75" cy="50" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="88" cy="50" r="4" fill="#FFFFFF" opacity="0.8"/>
  <rect x="110" y="46" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <!-- Security Shield Emblem -->
  <path d="M290 85 L320 85 C320 115 290 135 290 135 C290 135 260 115 260 85 Z" fill="url(#gradRed)"/>
  <path d="M278 102 L287 111 L304 94" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signature Lines -->
  <rect x="80" y="90" width="140" height="10" rx="5" fill="#F3F4F6"/>
  <rect x="80" y="112" width="110" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="80" y="130" width="130" height="8" rx="4" fill="#F3F4F6"/>
  <!-- Digital Signature Wave in Red -->
  <path d="M80 175 Q110 145 130 170 T170 165 T200 175 T240 160" stroke="#EE0033" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Token USB device -->
  <rect x="260" y="155" width="70" height="28" rx="8" fill="#1E293B"/>
  <rect x="330" y="161" width="16" height="16" rx="2" fill="#CBD5E1"/>
  <circle cx="285" cy="169" r="5" fill="#EE0033"/>
</svg>